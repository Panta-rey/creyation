# Bilder: Dateiname ab dem Ordner assets/bilder/. Jeder Eintrag unter absaetze: ist ein Absatz.

kopf:
  titel: "Rey Gafner"
  einstieg: "Ich baue, was es noch nicht gibt. Am liebsten dort, wo es für ein Problem noch keine Lösung gibt."
  absaetze:
    - "Ich bin Biologe (MSc UZH) und denke am liebsten mit den Händen. Schon im Gymnasium habe ich das musische Profil mit bildnerischem Gestalten gewählt, seit 2017 baue ich als Allrounder für Innenarchitekturbüros, Marken, Clubs, Events und Private: Möbel, Installationen, Skulpturen, Räume, Camperausbauten und eigene Produkte."
    - "Jede Idee beginnt bei mir mit einem Gespräch und einer Visualisierung in 3D. Sie sehen, was entsteht, bevor es entsteht. Dann fräse, drucke und baue ich in meiner Werkstatt in Hinteregg."
  bild: rey-gafner.jpg
  bild_beschrieb: "Rey Gafner"

visitenkarte:
  titel: "Die Geschichte meiner Visitenkarte"
  absaetze:
    - "2018 habe ich eine Visitenkarte entworfen, die sich ohne einen einzigen Schnitt zu einem Stuhl falten lässt. Die durchgezogenen Linien werden nach hinten gefaltet, die gepunkteten nach vorne. Heraus kommt ein Stuhl mit Holzsitz und Lehne, sinnbildlich für «Have a seat»."
    - "Aus diesem Stuhl ist später mein Logo entstanden: Lampe, Tisch und Stuhl zugleich. Und im Faltmuster steckt, was mich bis heute ausmacht: aus der Fläche in den Raum, mit einer Lösung, an die man zuerst nicht denkt."
  bild_muster: faltmuster-visitenkarte-2026.svg
  bild_muster_beschrieb: "Faltmuster der Visitenkarte: durchgezogene und gepunktete Linien, Sitz und Lehne in Holzoptik"
  bild_breit: start/faltprozess.jpg
  bild_breit_beschrieb: "Von links: Handskizze des Faltmusters, die gedruckte Karte und der gefaltete Stuhl"

werkstatt:
  titel: "Die Werkstatt"
  absaetze:
    - "In Hinteregg stehen meine CNC-Fräse (Arbeitsbereich 2800 × 1500 × 200 mm für Holz, Kunststoff und Aluminium) und meine 3D-Drucker. Geplant wird in SketchUp und Fusion 360."
    - "Was ich nicht selbst mache, übernehmen erfahrene Partnerbetriebe, etwa Polsterei, Lackiererei oder Lichtsteuerungen. Die Fäden bleiben bei mir."
  bild: start/cnc.jpg
  bild_beschrieb: "CNC-Fräse bei der Arbeit"

handschrift_titel: "Woran man meine Arbeiten erkennt"
handschrift:
  - stark: "Gesteckt statt geschraubt."
    text: "Flache Teile aus der CNC-Fräse werden zu leichten, zerlegbaren und erweiterbaren Objekten."
  - stark: "Licht als Teil der Idee."
    text: "Nicht als Zusatz, sondern als das, was ein Objekt lebendig macht."
  - stark: "Massgenau für den Menschen."
    text: "Ein Boxenständer auf Ohrhöhe, Handtuchfächer mit Initialen, Uhren im richtigen Winkel."
  - stark: "Reparieren statt wegwerfen."
    text: "Ersatzteile, die es nicht mehr gibt, konstruiere und drucke ich neu."
  - stark: "Mit einem Augenzwinkern."
    text: "Ein Katzenhaus als «Einzelzimmer zu vermieten», ein Teichablauf namens «Thirsty Koi»."

schluss:
  titel: "Setzen wir uns hin?"
  knopf: "Kontakt aufnehmen"
